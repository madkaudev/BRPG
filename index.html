<!DOCTYPE html>
<html lang="en-US">
    <head>
        <!-- Set the title and favicon image  -->
        <title>BRPG</title>
        <link rel="icon" href="images/logos/pngs/brpg_logo_2.png" type="image/x-icon"/>
        <!-- Author and description -->
        <meta name="author" content="Mad Kau"/>
        <meta name="description" content="The Browser Role Playing Game. Lead your squad of heroes to defeat the evil Lord Natu Plantu!"/>
        <!-- Basic Metadata for Open Graph Protocol -->
        <meta property="og:title" content="BRPG"/>
        <meta property="og:type" content="website"/>
        <meta property="og:url" content="https://www.BRPG.farawaygiant.com"/> <!-- Doesn't exist yet -->
        <meta property="og:image" content="images/logos/pngs/brpg_logo_2.png"/>
        <!-- Twitter/X cards -->
        <meta name="twitter:card" content="summary"/>
        <meta name="twitter:site" content="@farawaygiant"/>
        <meta name="twitter:title" content="BRPG"/>
        <meta name="twitter:description" content="The Browser Role Playing Game. Lead your squad of heroes to defeat the evil Lord Natu Plantu!"/>
        <meta name="twitter:image" content="images/logos/pngs/brpg_logo_2.png"/>
        <!-- Character set and viewport -->
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <!-- Load styles -->
        <link rel="stylesheet" href="stylesheets/canvas.css"/>
        <link rel="stylesheet" href="stylesheets/layout.css"/> 
        <!-- Load scripts -->
        <script type="module" src="scripts/battleScene.js" defer></script>
        <script type="module" src="scripts/battleMenuInputs.js" defer></script>
        <script src="scripts/layout.js" defer></script>
    </head>
    <body>
        <header>
            <!-- Coordinates of mouse -->
            <h3 id="header-h3">Current Pixel: (0,0)</h3>
        </header>
        <main>
            <canvas id="battle-scene" height="1280" width="720">
                Crazy battling going on right now!
            </canvas>
            <menu id="battle-menu">
                <input type="image" id="portrait" alt="Character Portrait" src="/images/ui/PNGs/coltPortrait.png" />
                <input type="image" id="attack" alt="Attack" src="/images/ui/PNGs/attack.png" />
                <input type="image" id="ability" alt="Ability" src="/images/ui/PNGs/ability.png" disabled />
                <input type="image" id="item" alt="Item" src="/images/ui/PNGs/item.png" disabled />
                <input type="image" id="escape" alt="Escape" src="/images/ui/PNGs/escape.png" />
            </menu>
            <menu id="text-box">
                <h3>Choose your attack target.</h3>
            </menu>
        </main>
        <footer></footer>
    </body>
</html>
